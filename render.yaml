services:
  - type: web
    name: finance-tracker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://finance-01-navy.vercel.app
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: finance-auditor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: finance-auditor-db
    databaseName: finance_auditor
    user: finance_user
